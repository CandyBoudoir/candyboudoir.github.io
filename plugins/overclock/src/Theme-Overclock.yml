name: Theme - Overclock
description: A hacker's heads-up display in acid yellow and data cyan on matte black. Charge chevrons for ratings, a reticle that locks on for favourites and a cold system voice.
version: 0.2.2
url: https://github.com/CandyBoudoir/candyboudoir.github.io/tree/main/plugins/overclock
ui:
  css:
    - overclock.css
  javascript:
    - overclock.js
  assets:
    /: assets
settings:
  calmMode:
    displayName: Calm mode
    description: Turn off Overclock's animations (hover glitches, scan lines, bursts, the ticking loader).
    type: BOOLEAN
  plainCopy:
    displayName: Plain labels
    description: Keep Stash's own wording instead of Overclock's system voice. Stash's SFW mode always uses plain labels.
    type: BOOLEAN
  restyleInsights:
    displayName: Restyle Insights
    description: "Off: the Insights plugin keeps its own Flexoki look on the Stats page. On: it takes Overclock's teal-black panels, clipped buttons and mono readouts. Shows while Insights is on; takes effect on the next page you open."
    type: BOOLEAN
  restylePerformersToolkit:
    displayName: Restyle Performers Toolkit
    description: "Off: the Performers Toolkit plugin keeps its own Flexoki look on its page and on performer pages. On: it takes Overclock's teal-black panels, clipped buttons and mono readouts. Shows while Performers Toolkit is on; takes effect on the next page you open."
    type: BOOLEAN
