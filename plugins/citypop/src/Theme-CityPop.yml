name: Theme - City Pop
description: Airbrushed 1980s dusk from Japanese city pop album covers. Record-sleeve cards, striped sunset suns for ratings, cassettes for audio-only scenes and a late-night FM host's voice.
version: 0.2.2
url: https://github.com/CandyBoudoir/candyboudoir.github.io/tree/main/plugins/citypop
ui:
  css:
    - citypop.css
  javascript:
    - citypop.js
  assets:
    /: assets
settings:
  calmMode:
    displayName: Calm mode
    description: Turn off City Pop's animations (card lifts, the sunset sweep, turning reels, bursts).
    type: BOOLEAN
  plainCopy:
    displayName: Plain labels
    description: Keep Stash's own wording instead of the FM host's lines. Stash's SFW mode always uses plain labels.
    type: BOOLEAN
  restyleInsights:
    displayName: Restyle Insights
    description: "Off: the Insights plugin keeps its own Flexoki look on the Stats page. On: it takes City Pop's dusk, panels, buttons and type. Shows while Insights is on; takes effect on the next page you open."
    type: BOOLEAN
  restylePerformersToolkit:
    displayName: Restyle Performers Toolkit
    description: "Off: the Performers Toolkit plugin keeps its own Flexoki look on its page and on performer pages. On: it takes City Pop's dusk, panels, buttons and type. Shows while Performers Toolkit is on; takes effect on the next page you open."
    type: BOOLEAN
  stashUIFonts:
    displayName: Stash UI fonts
    description: "For Stash UI, the replacement interface. Off: picking City Pop under Stash UI's Colors changes only its colours. On: it also sets Stash UI in City Pop's type, Jost for headings and labels. Shows while Stash UI is on; takes effect on the next page you open in Stash UI."
    type: BOOLEAN
