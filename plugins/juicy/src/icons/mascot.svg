      <stop offset="1" stop-color="#a8c018"/>
    </linearGradient>
    <linearGradient id="mascot-bow" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#d49bff"/>
      <stop offset="0.5" stop-color="#9b30ff"/>
      <stop offset="1" stop-color="#5b17b8"/>
