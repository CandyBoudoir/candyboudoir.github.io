    <use xlink:href="#mascot-stem" href="#mascot-stem"/>
    <use xlink:href="#mascot-leaf-shape" href="#mascot-leaf-shape"/>
    <use xlink:href="#mascot-bow-shape" href="#mascot-bow-shape"/>
  </g>
  <g fill="none" stroke="#d7fa54" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
