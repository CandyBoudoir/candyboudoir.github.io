<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-4 -4 72 74">
  <defs>
    <radialGradient id="mascot-fill" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff9ccf"/>
      <stop offset="0.45" stop-color="#fc3d9f"/>
      <stop offset="1" stop-color="#711c86"/>
    </radialGradient>
    <linearGradient id="mascot-leaf" x1="0" y1="0" x2="1" y2="1">
