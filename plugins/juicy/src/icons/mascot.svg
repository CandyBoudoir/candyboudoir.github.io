  <circle cx="23.2" cy="36.6" r="1.6" fill="#fff"/>
  <circle cx="38.2" cy="36.6" r="1.6" fill="#fff"/>
  <circle cx="25.9" cy="40.6" r="0.75" fill="#fff"/>
  <circle cx="40.9" cy="40.6" r="0.75" fill="#fff"/>
  <path d="M27.8 44.6C29.6 44 31 44.2 32 45.2C33 44.2 34.4 44 36.2 44.6C36.2 48.4 34.4 50.4 32 50.4C29.6 50.4 27.8 48.4 27.8 44.6Z" fill="#010224"/>
  <ellipse cx="32" cy="50" rx="3" ry="2.2" fill="#ff7cbf" clip-path="url(#mascot-mouth)"/>
  <path d="M27.8 44.6C29.6 44 31 44.2 32 45.2C33 44.2 34.4 44 36.2 44.6C36.2 48.4 34.4 50.4 32 50.4C29.6 50.4 27.8 48.4 27.8 44.6Z" fill="none" stroke="#010224" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
