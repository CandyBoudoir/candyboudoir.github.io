name: Theme - Juicy
description: Pink, playful and a little naughty. Glossy candy stickers, gold hearts for ratings and a gum-bubble loader.
version: 0.4.0
url: https://github.com/CandyBoudoir/candyboudoir.github.io/tree/main/plugins/juicy
ui:
  css:
    - juicy.css
  javascript:
    - juicy.js
  assets:
    /: assets
settings:
  calmMode:
    displayName: Calm mode
    description: Turn off Juicy's animations (hover tilts, heart bursts, the bubble loader).
    type: BOOLEAN
  plainCopy:
    displayName: Plain labels
    description: Keep Stash's own wording instead of Juicy's cheeky copy. Stash's SFW mode always uses plain labels.
    type: BOOLEAN
  restylePlugins:
    displayName: Restyle Insights and Performers Toolkit
    description: "Off: the Insights and Performers Toolkit plugins keep their own Flexoki look. On: they take Juicy's candy, plum panels, buttons and type. Takes effect on the next page you open."
    type: BOOLEAN
