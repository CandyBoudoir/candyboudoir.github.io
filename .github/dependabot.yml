# Weekly dependency updates, grouped, each version at least 3 days old.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Bootstrap stays at the version Stash ships (4.6.2): the design-system page
    # uses it to stand in for Stash's own styles.
    ignore:
      - dependency-name: bootstrap
    groups:
      dependencies:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
