# Installs every plugin on each Stash version they support and on the latest
# develop build, then checks that Stash still renders the elements each plugin
# depends on and compares screenshots. Runs nightly, on pushes to main and on pull requests.
# The report job keeps one issue per failing channel and opens a "Support
# Stash vX.Y.Z" issue when Stash ships a stable release, and one "Test Cherry
# Pick beside <plugin> <version>" issue per companion release. Companion legs
# (tests/stash/companions.mjs) install another author's plugin beside these
# and run Cherry Pick's contract specs with it enabled; they never fail the
# workflow.
name: Compatibility

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the screenshot baselines on the baseline Stash version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.matrix.outputs.legs }}
      new_stable: ${{ steps.matrix.outputs.new_stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: node tests/stash/matrix.mjs >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    needs: matrix
    name: Stash ${{ matrix.leg.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the supported stable versions can fail the workflow.
    continue-on-error: ${{ matrix.leg.channel != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.matrix.outputs.legs) }}
    env:
      STASH_URL: http://127.0.0.1:9999
      WORK: ${{ github.workspace }}/stash-work
      COMPANIONS: ${{ matrix.leg.companions || '' }}
      BROWSER: ${{ matrix.leg.browser || 'chromium' }}
    steps:
      # Full history: build.mjs dates each plugin from its last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # prepare.mjs draws the demo portraits with Chromium, so every leg needs it
      - run: pnpm exec playwright install --with-deps chromium ${{ matrix.leg.browser || '' }}
      # Stash Curator's manifest runs `python`; the runner may have only python3
      - name: Python for companion plugins
        if: matrix.leg.companions
        run: command -v python || sudo ln -s "$(command -v python3)" /usr/local/bin/python
      # Restash's backend imports stashapi, from stashapp-tools
      - name: Python packages for Restash
        if: matrix.leg.companions == 'restash'
        run: python3 -m pip install --user --break-system-packages stashapp-tools==0.2.59
      - name: Start Stash ${{ matrix.leg.name }}
        id: prepare
        run: |
          tests/stash/stash.sh "${{ matrix.leg.tag }}" "$WORK"
          tests/stash/media.sh "$WORK/library"
          node tests/stash/prepare.mjs
      - name: Elements the plugins depend on
        id: contract
        if: steps.prepare.outcome == 'success'
        run: pnpm exec playwright test ${{ (matrix.leg.companions || matrix.leg.browser) && 'plugins/cherrypick/tests/.*contract' || 'contract' }}
      - name: Screenshots
        id: visual
        if: always() && steps.prepare.outcome == 'success' && !matrix.leg.companions && !matrix.leg.browser
        continue-on-error: ${{ matrix.leg.channel != 'stable' }}
        run: pnpm exec playwright test visual ${{ inputs.update_snapshots && matrix.leg.baseline && '--update-snapshots=all' || '' }}
      - name: Record result
        if: always()
        run: node tests/stash/status.mjs
        env:
          LEG: ${{ matrix.leg.name }}
          CHANNEL: ${{ matrix.leg.channel }}
          PREPARE: ${{ steps.prepare.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-${{ matrix.leg.name }}
          path: |
            playwright-report/
            test-results/
            stash-work/stash.log
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: status-${{ matrix.leg.name }}
          path: status/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.update_snapshots && matrix.leg.baseline
        with:
          name: snapshots
          path: plugins/*/tests/snapshots/
          retention-days: 14

  report:
    needs: [matrix, test]
    if: always() && github.event_name != 'pull_request' && github.repository == 'CandyBoudoir/candyboudoir.github.io'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: status-*
          path: status
          merge-multiple: true
      - run: node tests/stash/report.mjs status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEW_STABLE: ${{ needs.matrix.outputs.new_stable }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # One issue per companion plugin with a release newer than its pin
      - run: node tests/stash/tested-with.mjs --issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
