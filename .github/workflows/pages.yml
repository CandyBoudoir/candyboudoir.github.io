# Publishes the CandyBoudoir plugin source to GitHub Pages on every push to
# main or prod:
#   /index.yml           stable channel: each plugin built from its own latest
#                        release tag (<folder>-vX.Y.Z) on prod, its zip served
#                        from that tag's GitHub Release
#   /develop/index.yml   develop channel: every plugin built from main, for
#                        Stash develop builds and for plugins not released
#                        yet, except incubating ones (`incubating = true` in
#                        plugin.mjs), which nothing publishes
#   /juicy/index.yml     Juicy alone, for installs made from Juicy's own source
#                        before the shared one existed, its zip served from
#                        the release like the stable channel's (and
#                        /juicy/develop/, served like the develop channel's)
# On prod, the release job first tags and releases each plugin whose version
# has no tag yet, so a version bump reaches the stable channel in the same run.
# A manual run can publish older tags as the stable channel to roll back.
# After deploying, the live indexes and zips are checked against the build.
#
# Only the build, deploy and verify jobs (publish-site.yml) queue in the `pages`
# concurrency group. GitHub keeps one pending entry per group and cancels it
# when a newer one arrives, so a whole prod run waiting there was cancelled by
# the next push to main before it tagged anything. The release job runs
# outside that queue, and a pending site job that a later run supersedes loses
# nothing: the later run's build starts after this release and checks out
# both branches and every tag.
name: Publish

on:
  push:
    branches: [main, prod]
  workflow_dispatch:
    inputs:
      stable_tags:
        description: Release tags to publish as the stable channel for their plugins, instead of each plugin's latest (for a rollback), e.g. "juicy-v0.3.2"
        required: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/prod'
    # Prod runs only: two releases at once would race to create the same tag.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: build.mjs dates each plugin from its last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  site:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    # One build-to-verify at a time, so deploys never overlap and the last
    # build to start is the last to deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-site.yml
    with:
      stable_tags: ${{ inputs.stable_tags }}
