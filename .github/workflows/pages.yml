# Publishes the CandyBoudoir plugin source to GitHub Pages on every push to
# main or prod:
#   /index.yml           stable channel: each plugin built from its own latest
#                        release tag (<folder>-vX.Y.Z) on prod, its zip served
#                        from that tag's GitHub Release
#   /develop/index.yml   develop channel: every plugin built from main, for
#                        Stash develop builds and for plugins not released
#                        yet, except incubating ones (`incubating = true` in
#                        plugin.mjs), which nothing publishes
#   /juicy/index.yml     Juicy alone, for installs made from Juicy's own source
#                        before the shared one existed, its zip served from
#                        the release like the stable channel's (and
#                        /juicy/develop/, served like the develop channel's)
# Plugins from other CandyBoudoir repos (plugins.external.json) join both
# channels: stable from each one's latest release tag in its own repo, develop
# from its main. A daily run picks up their releases, since a release there
# pushes nothing here.
# On prod, the release job first tags and releases each plugin whose version
# has no tag yet, so a version bump reaches the stable channel in the same run.
# A manual run can publish older tags as the stable channel to roll back.
# After deploying, the live indexes and zips are checked against the build.
name: Publish

on:
  push:
    branches: [main, prod]
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      stable_tags:
        description: Release tags to publish as the stable channel for their plugins, instead of each plugin's latest (for a rollback), e.g. "juicy-v0.3.2"
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: build.mjs dates each plugin from its last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: stable.mjs builds each plugin from its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod
          path: stable
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: stable/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            stable/pnpm-lock.yaml
            develop/pnpm-lock.yaml
      - name: Build the stable channel
        working-directory: stable
        run: pnpm install --frozen-lockfile && node scripts/stable.mjs ../stable-site --tags "$STABLE_TAGS"
        env:
          STABLE_TAGS: ${{ inputs.stable_tags }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the develop channel
        working-directory: develop
        run: pnpm install --frozen-lockfile && pnpm check && node scripts/build.mjs --publish && node scripts/external.mjs develop
      - name: Assemble the site
        run: node stable/scripts/assemble.mjs stable-site develop/dist site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: built
      - name: Check the live channels match the build
        run: |
          mkdir site && tar -xf built/artifact.tar -C site
          node scripts/verify-live.mjs site https://candyboudoir.github.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
