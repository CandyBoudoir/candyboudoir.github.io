# Tags and publishes a GitHub Release when prod carries a version that has no
# tag yet. The release notes are that version's CHANGELOG section plus the
# Stash versions it was tested on, and the asset is the same reproducible zip
# the plugin source serves.
name: Release

on:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
