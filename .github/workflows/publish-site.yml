# Builds both channels, deploys them to GitHub Pages and checks the live site,
# for the Publish workflow (pages.yml), which calls it once per run inside the
# `pages` concurrency group so these three jobs never overlap another run's.
# The build checks out the prod and main branches, not the pushed commit, so
# whichever run deploys last publishes both branches and every tag as they
# stand when its build starts.
name: Publish site

on:
  workflow_call:
    inputs:
      stable_tags:
        description: Release tags to publish as the stable channel for their plugins, instead of each plugin's latest
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: stable.mjs builds each plugin from its tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod
          path: stable
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: stable/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            stable/pnpm-lock.yaml
            develop/pnpm-lock.yaml
      - name: Build the stable channel
        working-directory: stable
        run: pnpm install --frozen-lockfile && node scripts/stable.mjs ../stable-site --tags "$STABLE_TAGS"
        env:
          STABLE_TAGS: ${{ inputs.stable_tags }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the develop channel
        working-directory: develop
        run: pnpm install --frozen-lockfile && pnpm check && node scripts/build.mjs --publish
      - name: Assemble the site
        run: node stable/scripts/assemble.mjs stable-site develop/dist site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: built
      - name: Check the live channels match the build
        run: |
          mkdir site && tar -xf built/artifact.tar -C site
          node scripts/verify-live.mjs site https://candyboudoir.github.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
